<style>
:root{--forest:#2F8A5C;--green:#4CAF50;--light:#81C784;--sage:#C7CCB9;--cream:#FDFBF7;--ease:cubic-bezier(.2,.7,.2,1);--glow1:#1d4d34;--glow2:rgba(19,51,34,.85);--bg:#153B28;--bg2:#102A1D;--bg3:#0E2318;--surface:#1B4630;--surface2:#123322;--surface3:#1F5136;--line:rgba(199,204,185,.22);--line-strong:rgba(199,204,185,.45);--ink:#FDFBF7;--ink-soft:#E4F1E6;--muted:#9CB2A2;--mid:#C7CCB9;--accent-soft:rgba(76,175,80,.16);--on-accent:#fff;--btn-solid:#123322;--focus:#F2C14E;--mono:"Space Mono",monospace;--sans:"Space Grotesk",Arial,sans-serif;--white:var(--surface);--paper:var(--surface3);--panel-radius:20px;--card-radius:16px;--shadow:0 14px 38px rgba(0,0,0,.22)}
html[data-theme="light"]{--glow1:#DFF0E3;--glow2:rgba(230,242,232,.9);--bg:#F2F8F2;--bg2:#F7FBF6;--bg3:#FDFBF7;--surface:#FFFFFF;--surface2:#F1F8F2;--surface3:#EAF4EC;--line:rgba(47,138,92,.22);--line-strong:rgba(47,138,92,.45);--green:#2F8A5C;--ink:#123322;--ink-soft:#25563A;--muted:#6B7C6E;--mid:#4E6355;--accent-soft:#E9F7EC;--on-accent:#fff;--btn-solid:#123322;--focus:#B26A00}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(1200px 720px at 18% -12%,var(--glow1) 0%,transparent 58%),radial-gradient(1000px 640px at 112% 8%,var(--glow2) 0%,transparent 60%),linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%);background-attachment:fixed;font-family:var(--sans);color:var(--ink)}
svg#dg{display:block;width:100vw;height:calc(100vh - 76px);font-family:var(--sans)}svg#dg>rect:first-of-type{fill:transparent}svg#dg .node .card{fill:var(--surface2)!important;stroke:var(--line-strong)!important}svg#dg .node text{fill:var(--ink)}svg#dg>rect[stroke="#C7CCB9"][stroke-width="2"]{fill:var(--surface)!important;stroke:var(--line-strong)!important}
.topbar{height:76px;padding:0 24px;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);color:var(--ink);position:relative;z-index:3}.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;text-decoration:none;color:var(--ink);font:700 14px var(--mono);letter-spacing:.04em;margin-right:auto}.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}.brand span{color:var(--muted);font-weight:400}.top-actions{display:flex;gap:7px;align-items:center;overflow-x:auto;white-space:nowrap}.topbar button,.topbar a.action{border:1px solid var(--line);padding:9px 12px;background:var(--surface);color:var(--ink);border-radius:6px;font:11px var(--mono);text-decoration:none;cursor:pointer}.topbar button.active{background:var(--btn-solid);color:#fff}.diagram-layout{display:none}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface2);color:var(--ink);font:13.5px/1.4 var(--mono);border:1px solid var(--line-strong);padding:9px 13px;border-radius:9px;max-width:320px;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
#backdrop.open{backdrop-filter:blur(6px)}#drawer{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow)}#dbody h3,#dbody a{color:var(--green)}#dbody .facts li{border-color:var(--line)}#dbody .facts b{color:var(--ink)}.badge{background:var(--surface3);color:var(--ink)}.badge.plan,.links button{background:var(--surface2);color:var(--ink)}#sc{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow)}.sc-top button.tab,.sc-top button.ic{background:var(--surface2);color:var(--ink);border-color:var(--line)}.sc-top button.tab.on{background:var(--btn-solid);color:#fff}.dots i{background:var(--line-strong)}
.diagram-layout{display:none;padding:20px;gap:12px}.layer{background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);border-radius:var(--panel-radius);box-shadow:var(--shadow);padding:14px;animation:arrive .45s both;animation-delay:calc(var(--i)*60ms)}.layer h2{font:700 13px var(--mono);letter-spacing:.13em;text-transform:uppercase;margin:0 0 12px;color:var(--ink)}.layer-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mobile-card{min-width:0;padding:0;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--card-radius);background:var(--surface2);cursor:pointer;transition:transform .2s,opacity .2s,box-shadow .2s,border-color .2s}.mobile-card:hover,.mobile-card.hl{transform:translateY(-2px);border-color:var(--green);box-shadow:0 0 16px #4caf5040}.mobile-card svg{display:block;width:100%;height:auto}.mobile-card[data-planned="1"]{border-style:dashed}.mobile-card.off{display:none}.mobile-card.fade{opacity:.35}.connector{height:30px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--mid);font:11px var(--mono)}.connector:after{content:"";height:13px;width:1px;background:var(--green);animation:arrow 1.3s ease-in-out infinite alternate}.connector span{order:-1}.adv-copy{font-size:14px;line-height:1.6;color:var(--ink-soft)}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes arrow{to{transform:translateY(5px)}}
@media(max-width:1099px){html,body{height:auto;min-height:100%;overflow-x:hidden}.topbar{height:auto;min-height:68px;padding:10px 12px;align-items:flex-start;flex-wrap:wrap}.brand{margin-right:0}.top-actions{width:100%;padding-bottom:2px;scrollbar-width:thin}.topbar button,.topbar a.action{padding:9px 11px;font-size:14px}.diagram-layout{display:grid}.diagram-layout[hidden]{display:none}svg#dg{display:none}#drawer{width:calc(100vw - 24px);max-height:calc(100dvh - 24px);border-radius:20px}#drawer header{padding:18px}#drawer h2{font-size:25px}#dbody{padding:18px;font-size:16px}.layer-cards{grid-template-columns:repeat(2,minmax(0,1fr))}#sc{bottom:10px}}

@media(max-width:699px){#sc-step,#sc-text,.sc-top button.tab{font-size:14px}#sc{width:calc(100vw - 20px);max-height:48vh;overflow:auto}}

#backdrop{position:fixed;inset:0;background:rgba(18,38,28,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:19}
#backdrop.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;left:50%;top:50%;width:min(860px,92vw);max-height:88vh;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:26px;box-shadow:var(--shadow);transform:translate(-50%,-47%) scale(.96);opacity:0;pointer-events:none;transition:transform .24s ease,opacity .2s;z-index:20;display:flex;flex-direction:column;overflow:hidden}
#drawer.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
#drawer header{background:var(--surface3);color:var(--ink);border-bottom:1px solid var(--line);padding:20px 24px;display:flex;gap:16px;align-items:center}
#dicon{width:72px;height:72px;flex:none}#drawer .sicpes-modal-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;border:1px solid #ffffff88}
#dicon svg{display:block;width:100%;height:100%;overflow:visible}
#drawer h2{margin:0;font-size:36px;font-weight:800;line-height:1.1}
#drawer .kind{font-size:14px;letter-spacing:.08em;opacity:.9;margin-top:6px}
#dclose{margin-left:auto;align-self:center;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line-strong);color:var(--ink);border-radius:10px;width:40px;height:40px;padding:0;cursor:pointer;flex:none}#dclose svg{width:18px;height:18px;display:block}#dclose:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#dclose:hover{background:rgba(255,255,255,.32)}
#dbody{padding:24px 30px 32px;overflow:auto;font-size:17px;line-height:1.6;color:var(--ink)}#dbody p{color:var(--ink);font-size:17px;line-height:1.65;margin:10px 0 12px}
.badge{display:inline-block;font-size:14px;font-weight:800;letter-spacing:.06em;padding:6px 16px;border-radius:99px;border:1.5px solid #4CAF50;color:#2F8A5C;background:#E4F1E6;margin-bottom:18px}
.badge.plan{background:#fff;border-style:dashed}
#dbody p{margin:0 0 8px}
#dbody h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#2F8A5C;margin:18px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:#E4F1E6;color:#1F6B45;border-radius:99px;padding:6px 14px;font-size:15px;font-weight:700}
.facts{margin:0;padding:0;list-style:none}
.facts li{padding:10px 0 10px 24px;border-bottom:1px solid #C7CCB9;position:relative}
.facts li:before{content:'›';position:absolute;left:4px;top:7px;color:#4CAF50;font-weight:800;font-size:22px;line-height:1}
.facts b{display:block;font-size:17px;color:#1E2B24;font-weight:800}
#dbody a{color:var(--green);font-weight:700;word-break:break-all}.tags span{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-size:13px}.facts li{color:var(--ink-soft)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{border:1.5px solid #81C784;background:#fff;color:#1F6B45;font:inherit;font-size:15px;font-weight:700;border-radius:10px;padding:8px 14px;cursor:pointer}
.links button:hover{background:#E4F1E6}
#sc{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(900px,94vw);background:#fff;border:2px solid #2F8A5C;border-radius:16px;box-shadow:0 10px 30px rgba(31,107,69,.28);z-index:25;padding:12px 16px 14px}
#sc[hidden]{display:none}
.sc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc-top button.tab{border:1.5px solid #81C784;background:#fff;color:#1F6B45;font:inherit;font-size:13.5px;font-weight:700;border-radius:99px;padding:6px 14px;cursor:pointer}
.sc-top button.tab.on{background:#2F8A5C;color:#fff;border-color:#2F8A5C}
.sc-top .sp{flex:1}
.sc-top button.ic{border:1.5px solid #81C784;background:#fff;color:#1F6B45;border-radius:8px;width:34px;height:32px;font-size:14px;cursor:pointer}
.sc-top button.ic:hover{background:#E4F1E6}
#sc-text{margin:10px 2px 0;font-size:15px;line-height:1.45}
#sc-step{font-size:11.5px;letter-spacing:.12em;font-weight:800;color:#2F8A5C;text-transform:uppercase;margin:10px 2px 0}
.dots{display:flex;gap:6px;margin:8px 2px 0}
.dots i{height:5px;flex:1;background:#C7CCB9;border-radius:3px}
.dots i.on{background:#4CAF50}
