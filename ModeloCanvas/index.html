<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Model Canvas — SICPES</title>
  <meta name="description" content="Business Model Canvas interactivo de SICPES: Sistema Integral de Control de Pensión de Estudiantes.">
  <link rel="icon" href="../images/SICPES_Producto.png">
  <link rel="apple-touch-icon" href="../images/SICPES_Producto.png">
  <link rel="stylesheet" href="./styles.css">
  <!-- Tema inicial sin parpadeo: respeta la preferencia guardada o del sistema. -->
  <script>
    (function () {
      var t = 'dark';
      try {
        t = localStorage.getItem('sicpes-canvas-theme');
        if (!t) {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
      } catch (e) {
        t = 'dark';
      }
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
</head>
<body>

  <!-- ============ Encabezado e identidad visual ============ -->
  <header class="masthead">
    <div class="masthead__id">
      <span class="masthead__logos">
        <img class="masthead__logo" src="../images/SICPES_Empresa.png" alt="Logotipo de la empresa SICPES" width="48" height="48">
        <img class="masthead__logo" src="../images/SICPES_Producto.png" alt="Logotipo de la aplicación SICPES" width="48" height="48">
      </span>
      <div class="masthead__text">
        <h1 class="masthead__title">Business Model Canvas <span class="masthead__brand">— SICPES</span></h1>
        <p class="masthead__tagline">Sistema Integral de Control de Pensión de Estudiantes</p>
      </div>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a tema claro">Tema claro</button>
  </header>

  <!-- ============ Canvas ============ -->
  <main class="page">
    <h2 class="visually-hidden">Los nueve bloques del modelo de negocio de SICPES</h2>
    <section class="canvas" id="canvas" aria-label="Business Model Canvas de SICPES"></section>
  </main>

  <!-- ============ Marcas de producto y empresa ============ -->
  <footer class="site-foot">
    <div class="site-foot__brand">
      <img class="site-foot__logo" src="../images/SICPES_Producto.png" alt="Logotipo de la aplicación SICPES" width="40" height="40">
      <span class="site-foot__label">Producto</span>
    </div>
    <div class="site-foot__brand">
      <img class="site-foot__logo" src="../images/SICPES_Empresa.png" alt="Logotipo de la empresa SICPES" width="40" height="40">
      <span class="site-foot__label">Empresa</span>
    </div>
    <p class="site-foot__note">SICPES · Sistema Integral de Control de Pensión de Estudiantes</p>
  </footer>

  <!-- ============ Capa de atenuación y cierre ============ -->
  <div class="scrim" id="scrim" hidden></div>

  <button class="closer" id="closer" type="button" hidden aria-label="Cerrar bloque expandido">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12"></path>
      <path d="M18 6 6 18"></path>
    </svg>
  </button>

  <script src="./data.js"></script>
  <script src="./script.js"></script>
</body>
</html>
